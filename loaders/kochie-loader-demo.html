<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kochie loader demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --bg:#1A1815; --elev:#232019; --text:#F4EFE6; --muted:#C9C0B0; --soft:#8C8576; --clay:#DA8665; --rule:rgba(244,239,230,.12); }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:"Geist Mono",ui-monospace,monospace; display:grid; place-items:center; padding:24px 16px; }
main { width:100%; max-width:520px; display:grid; gap:28px; justify-items:center; }
.stage { width:100%; aspect-ratio: 1; max-width:320px; display:grid; place-items:center; border:1px solid var(--rule); border-radius:14px; background:#14110E; }
.kicker { font-size:12px; letter-spacing:.18em; color:var(--muted); text-transform:uppercase; } .kicker b { color:var(--clay); font-weight:500; }
.controls { width:100%; display:grid; gap:10px; }
label { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border:1px solid var(--rule); border-radius:10px; background:var(--elev); font-size:13px; letter-spacing:.06em; cursor:pointer; }
label small { color:var(--soft); letter-spacing:0; }
input[type=checkbox] { accent-color: var(--clay); width:18px; height:18px; }
button { font:inherit; font-size:14px; letter-spacing:.12em; padding:14px; border-radius:10px; border:1px solid var(--clay); background:transparent; color:var(--text); cursor:pointer; width:100%; }
button:hover { background:rgba(218,134,101,.12); }
.log { font-size:12px; color:var(--soft); min-height:1.4em; }
</style>
<style>/* Kochie K loader — modes on the root: .klr + one of .is-in .is-out .is-loop .is-static (+ .spin) */
.klr .kp { transform-box: fill-box; transform-origin: center; }
.klr .kg { transform-box: view-box; transform-origin: 30px 30px; }
.klr .p1 { --dx: -18px; --dy: -18px; --r: -60deg; --d: 0s; }
.klr .p2 { --dx:  18px; --dy: -18px; --r:  60deg; --d: .09s; }
.klr .p3 { --dx: -18px; --dy:  18px; --r: -60deg; --d: .18s; }
.klr .p4 { --dx:  18px; --dy:  18px; --r:  60deg; --d: .27s; }
.klr.is-static .kp { opacity: 1; }
.klr.is-hidden .kp { opacity: 0; }
/* slide (default) */
.klr.is-in   .kp { animation: kl-in  .85s var(--d) both cubic-bezier(.16, 1, .3, 1); }
.klr.is-out  .kp { animation: kl-out .5s  var(--d) both cubic-bezier(.7, 0, .84, 0); }
.klr.is-loop .kp { animation: kl-loop 2.8s var(--d) infinite both; }
@keyframes kl-in  { from { opacity: 0; transform: translate(var(--dx), var(--dy)); } to { opacity: 1; transform: none; } }
@keyframes kl-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
@keyframes kl-loop {
  0%   { opacity: 0; transform: translate(var(--dx), var(--dy)); animation-timing-function: cubic-bezier(.16, 1, .3, 1); }
  30%  { opacity: 1; transform: none; }
  68%  { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.7, 0, .84, 0); }
  84%, 100% { opacity: 0; transform: translate(var(--dx), var(--dy)); }
}
/* spin */
.klr.spin.is-in   .kg { animation: ks-gin  1.1s both cubic-bezier(.16, 1, .3, 1); }
.klr.spin.is-in   .kp { animation: ks-in   .85s var(--d) both cubic-bezier(.16, 1, .3, 1); }
.klr.spin.is-out  .kg { animation: ks-gout .6s  both cubic-bezier(.7, 0, .84, 0); }
.klr.spin.is-out  .kp { animation: ks-out  .5s  var(--d) both cubic-bezier(.7, 0, .84, 0); }
.klr.spin.is-loop .kg { animation: ks-gloop 2.8s infinite both; }
.klr.spin.is-loop .kp { animation: ks-loop  2.8s var(--d) infinite both; }
@keyframes ks-gin  { from { transform: rotate(-90deg); } to { transform: none; } }
@keyframes ks-gout { from { transform: none; } to { transform: rotate(90deg); } }
@keyframes ks-in   { from { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(.6); } to { opacity: 1; transform: none; } }
@keyframes ks-out  { from { opacity: 1; transform: none; } to { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(calc(var(--r) * -1)) scale(.6); } }
@keyframes ks-gloop {
  0%   { transform: rotate(-90deg); animation-timing-function: cubic-bezier(.16, 1, .3, 1); }
  40%, 68% { transform: none; animation-timing-function: cubic-bezier(.7, 0, .84, 0); }
  86%, 100% { transform: rotate(90deg); }
}
@keyframes ks-loop {
  0%   { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(.6); animation-timing-function: cubic-bezier(.16, 1, .3, 1); }
  30%  { opacity: 1; transform: none; }
  68%  { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.7, 0, .84, 0); }
  84%, 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(calc(var(--r) * -1)) scale(.6); }
}
/* reduced motion: fades only, no travel or rotation */
@media (prefers-reduced-motion: reduce) {
  .klr .kg, .klr.spin .kg { animation: none !important; }
  .klr.is-in .kp, .klr.spin.is-in .kp   { animation: kl-fade-in .3s both; }
  .klr.is-out .kp, .klr.spin.is-out .kp { animation: kl-fade-out .3s both; }
  .klr.is-loop .kp, .klr.spin.is-loop .kp { animation: kl-pulse 2.4s ease-in-out infinite both; }
  @keyframes kl-fade-in  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes kl-fade-out { from { opacity: 1; } to { opacity: 0; } }
  @keyframes kl-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
}</style></head>
<body><main>
<div class="kicker">// <b>KOCHIE</b> LOADER · DEMO</div>
<div class="stage"><svg id="k" viewBox="-14 -14 88 88" width="160" height="160" role="img" aria-label="Loading" class="klr is-in"><g class="kg"><path class="kp p1" fill="#FDBB0D" d="M32.795,2C33.194,2 33.553,2.24 33.706,2.609C33.859,2.978 33.774,3.402 33.492,3.684C27.815,9.359 9.42,27.749 3.708,33.459C3.422,33.745 2.991,33.831 2.618,33.676C2.244,33.521 2,33.156 2,32.752C2,25.563 2,4.8 2,4.8C2,3.255 3.254,2 4.8,2L32.795,2Z"/><path class="kp p2" fill="#C34406" d="M36.96,12.943C36.022,12.006 35.495,10.734 35.496,9.408C35.496,8.082 36.023,6.81 36.961,5.872C37.513,5.32 37.905,4.928 37.905,4.928C39.781,3.053 42.324,2 44.975,2C49.219,2 55.2,2 55.2,2C56.746,2 58,3.255 58,4.8L58,15.034C58,17.687 56.946,20.231 55.07,22.106C55.07,22.106 54.68,22.496 54.13,23.046C52.177,24.999 49.011,24.998 47.059,23.045C44.105,20.091 39.914,15.898 36.96,12.943Z"/><path class="kp p3" fill="#C34406" d="M24.938,17.891C26.891,15.939 30.057,15.94 32.009,17.892C34.963,20.847 39.154,25.04 42.108,27.994C43.046,28.932 43.572,30.204 43.572,31.53C43.572,32.856 43.045,34.128 42.107,35.065C35.534,41.637 22.095,55.072 22.095,55.072C20.219,56.947 17.676,58 15.025,58C10.781,58 4.8,58 4.8,58C3.255,58 2,56.745 2,55.2L2,44.966C2,42.313 3.054,39.769 4.93,37.894C4.93,37.894 18.366,24.462 24.938,17.891Z"/><path class="kp p4" fill="#741516" d="M55.2,58L27.238,58C26.834,58 26.469,57.756 26.314,57.383C26.16,57.009 26.245,56.579 26.531,56.293C32.235,50.59 50.59,32.241 56.293,26.54C56.579,26.254 57.009,26.168 57.383,26.323C57.756,26.478 58,26.843 58,27.247C58,34.434 58,55.2 58,55.2C58,56.745 56.746,58 55.2,58Z"/></g></svg></div>
<button id="toggle">HIDE</button>
<div class="controls">
<label>ANIMATE IN <small>assemble when shown</small><input type="checkbox" id="ain" checked></label>
<label>ANIMATE OUT <small>fly apart when hidden</small><input type="checkbox" id="aout" checked></label>
<label>LOOP <small>keep cycling while visible</small><input type="checkbox" id="loop"></label>
<label>SPIN <small>rotating variant</small><input type="checkbox" id="spin"></label>
</div>
<div class="log" id="log">visible · animating in</div>
</main>
<script>
// Mirrors KochieLoader.tsx: visible + animateIn / animateOut / loop / spin
const k = document.getElementById('k'), btn = document.getElementById('toggle'), log = document.getElementById('log');
const $ = id => document.getElementById(id);
let visible = true, phase = 'in';
const settled = () => $('loop').checked ? 'loop' : 'static';
function render() {
  k.setAttribute('class', `klr is-${phase === 'gone' ? 'hidden' : phase}${$('spin').checked ? ' spin' : ''}`);
  btn.textContent = visible ? 'HIDE' : 'SHOW';
  log.textContent = { in: 'visible · animating in', out: 'hiding · animating out', static: 'visible · assembled', loop: 'visible · looping', gone: 'gone' }[phase];
}
function set(p) { phase = p; k.getBoundingClientRect(); render(); }
btn.onclick = () => {
  visible = !visible;
  if (visible) set($('ain').checked ? 'in' : settled());
  else set($('aout').checked ? 'out' : 'gone');
};
k.addEventListener('animationend', e => {
  if (!e.target.classList.contains('p4')) return;
  if (phase === 'in') set(settled()); else if (phase === 'out') set('gone');
});
$('loop').onchange = () => { if (phase === 'static' || phase === 'loop') set(settled()); };
$('spin').onchange = render;
render();
</script></body></html>
